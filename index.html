<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prototipo SERBACH - Aula Completa Interactiva</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #f0f0f0; }
        canvas { display: block; }
        #info {
            position: absolute;
            top: 10px;
            width: 100%;
            text-align: center;
            font-family: Arial, sans-serif;
            color: #333;
            pointer-events: none;
            z-index: 100;
        }
    </style>
</head>
<body>
    <div id="info">
        <h2>Proyecto SERBACH - Vista 3D del Aula</h2>
        <p>Usa el mouse para girar la cámara, moverte por la clase y hacer zoom.</p>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

    <script>
        // 1. CONFIGURACIÓN DE LA ESCENA
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0xe5e5e5);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 8, 7); // Vista aérea diagonal ideal

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        document.body.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.target.set(0, 0, 0);
        controls.maxPolarAngle = Math.PI / 2 - 0.05; // Evita atravesar el suelo
        controls.update();

        // 2. ILUMINACIÓN
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
        scene.add(ambientLight);

        const directionalLight = new THREE.DirectionalLight(0xffffff, 0.6);
        directionalLight.position.set(4, 10, 5);
        directionalLight.castShadow = true;
        directionalLight.shadow.mapSize.width = 2048;
        directionalLight.shadow.mapSize.height = 2048;
        scene.add(directionalLight);

        // 3. DIMENSIONES DEL AULA (Escala: 1 unidad = 1 metro)
        const roomWidth = 8;
        const roomDepth = 4;
        const wallHeight = 3;

        // Piso del aula
        const floorGeo = new THREE.PlaneGeometry(roomWidth, roomDepth);
        const floorMat = new THREE.MeshStandardMaterial({ color: 0xd8d8d8, roughness: 0.8 });
        const floor = new THREE.Mesh(floorGeo, floorMat);
        floor.rotation.x = -Math.PI / 2;
        floor.receiveShadow = true;
        scene.add(floor);

        // Material para las paredes
        const wallMat = new THREE.MeshStandardMaterial({ color: 0xfcfaf2, roughness: 0.9 });

        // Pared Trasera
        const backWall = new THREE.Mesh(new THREE.BoxGeometry(roomWidth, wallHeight, 0.1), wallMat);
        backWall.position.set(0, wallHeight / 2, -roomDepth / 2);
        backWall.receiveShadow = true;
        scene.add(backWall);

        // Pared Frontal
        const frontWall = new THREE.Mesh(new THREE.BoxGeometry(roomWidth, wallHeight, 0.1), wallMat);
        frontWall.position.set(0, wallHeight / 2, roomDepth / 2);
        frontWall.receiveShadow = true;
        scene.add(frontWall);

        // Pared Izquierda
        const leftWall = new THREE.Mesh(new THREE.BoxGeometry(0.1, wallHeight, roomDepth), wallMat);
        leftWall.position.set(-roomWidth / 2, wallHeight / 2, 0);
        leftWall.receiveShadow = true;
        scene.add(leftWall);

        // Pared Derecha
        const rightWall = new THREE.Mesh(new THREE.BoxGeometry(0.1, wallHeight, roomDepth), wallMat);
        rightWall.position.set(roomWidth / 2, wallHeight / 2, 0);
        rightWall.receiveShadow = true;
        scene.add(rightWall);


        // 4. PROTOTIPO DE CASILLEROS DE CARTÓN (Fila de 5x4)
        const boxW = 0.50; const boxH = 0.30; const boxD = 0.40;
        const rows = 4; const cols = 5;

        const boxGeo = new THREE.BoxGeometry(boxW, boxH, boxD);
        const boxMat = new THREE.MeshStandardMaterial({ color: 0xbca07d, roughness: 1.0 });

        const lockersGroup = new THREE.Group();

        for (let r = 0; r < rows; r++) {
            for (let c = 0; c < cols; c++) {
                const box = new THREE.Mesh(boxGeo, boxMat);
                const x = (c * boxW) - ((cols * boxW) / 2) + (boxW / 2);
                const y = (r * boxH) + (boxH / 2);
                box.position.set(x, y, 0);
                box.castShadow = true;
                box.receiveShadow = true;

                // Líneas de las uniones del cartón
                const edges = new THREE.LineSegments(
                    new THREE.EdgesGeometry(boxGeo),
                    new THREE.LineBasicMaterial({ color: 0x8a6e4d, linewidth: 1 })
                );
                box.add(edges);
                lockersGroup.add(box);
            }
        }
        // Centrado en la pared de atrás
        lockersGroup.position.set(0, 0, -roomDepth / 2 + boxD / 2 + 0.05);
        scene.add(lockersGroup);


        // 5. NUEVOS ELEMENTOS: PIZARRÓN Y TELEVISIÓN (En la pared del frente)
        // Pizarrón Verde Escolar
        const boardGeo = new THREE.BoxGeometry(3.2, 1.2, 0.04);
        const boardMat = new THREE.MeshStandardMaterial({ color: 0x1e3f20, roughness: 0.7 }); // Verde oscuro
        const board = new THREE.Mesh(boardGeo, boardMat);
        board.position.set(0, 1.3, roomDepth / 2 - 0.03); // Pegado a la pared frontal
        board.castShadow = true;
        scene.add(board);

        // Marco del pizarrón (aluminio/madera simulada con líneas)
        const boardFrame = new THREE.LineSegments(
            new THREE.EdgesGeometry(boardGeo),
            new THREE.LineBasicMaterial({ color: 0xdddddd, linewidth: 2 })
        );
        board.add(boardFrame);

        // Televisión arriba del pizarrón
        const tvGeo = new THREE.BoxGeometry(1.4, 0.8, 0.06);
        const tvMat = new THREE.MeshStandardMaterial({ color: 0x151515, roughness: 0.2 }); // Negro brillante
        const tv = new THREE.Mesh(tvGeo, tvMat);
        tv.position.set(0, 2.4, roomDepth / 2 - 0.04); 
        tv.castShadow = true;
        scene.add(tv);


        // 6. NUEVO ELEMENTO: MESA DE LA PROFESORA (Esquina delantera izquierda)
        const teacherDesk = new THREE.Group();
        // Tapa de la mesa
        const tTopGeo = new THREE.BoxGeometry(1.4, 0.04, 0.7);
        const tTopMat = new THREE.MeshStandardMaterial({ color: 0x5c4033, roughness: 0.5 }); // Madera oscura
        const tTop = new THREE.Mesh(tTopGeo, tTopMat);
        tTop.position.y = 0.75;
        tTop.castShadow = true;
        teacherDesk.add(tTop);

        // Patas de la mesa
        const tLegGeo = new THREE.CylinderGeometry(0.02, 0.02, 0.75, 8);
        const tLegMat = new THREE.MeshStandardMaterial({ color: 0x222222 });
        const tLegOffsets = [[0.65, 0.3], [-0.65, 0.3], [0.65, -0.3], [-0.65, -0.3]];
        tLegOffsets.forEach(os => {
            const leg = new THREE.Mesh(tLegGeo, tLegMat);
            leg.position.set(os[0], 0.75 / 2, os[1]);
            leg.castShadow = true;
            teacherDesk.add(leg);
        });
        // Ubicación en la esquina izquierda del frente
        teacherDesk.position.set(-2.8, 0, 1.3);
        scene.add(teacherDesk);


        // 7. NUEVO ELEMENTO: PUERTA DE ENTRADA (Esquina trasera derecha - Opuesta a la mesa)
        const doorGeo = new THREE.BoxGeometry(0.9, 2.1, 0.04);
        const doorMat = new THREE.MeshStandardMaterial({ color: 0x8b5a2b, roughness: 0.8 }); // Madera clara
        const door = new THREE.Mesh(doorGeo, doorMat);
        // Colocada de manera visual en la pared de atrás a la derecha
        door.position.set(3.3, 2.1 / 2, -roomDepth / 2 + 0.03);
        door.castShadow = true;
        scene.add(door);

        // Picaporte de la puerta
        const knobGeo = new THREE.CylinderGeometry(0.02, 0.02, 0.08, 8);
        const knobMat = new THREE.MeshStandardMaterial({ color: 0xaaaaaa, metalness: 0.8 });
        const knob = new THREE.Mesh(knobGeo, knobMat);
        knob.rotation.x = Math.PI / 2;
        knob.position.set(-0.35, 0, 0.03);
        door.add(knob);


        // 8. GRUPOS DE MESAS STUDENTILES (Mesas hexagonales en ronda de 4)
        function createHexagonalTable() {
            const table = new THREE.Group();
            const topGeo = new THREE.CylinderGeometry(0.35, 0.35, 0.04, 6);
            const topMat = new THREE.MeshStandardMaterial({ color: 0x966f33, roughness: 0.6 });
            const tableTop = new THREE.Mesh(topGeo, topMat);
            tableTop.position.y = 0.70;
            tableTop.rotation.y = Math.PI / 6;
            tableTop.castShadow = true;
            table.add(tableTop);

            const legGeo = new THREE.CylinderGeometry(0.015, 0.015, 0.70, 8);
            const legMat = new THREE.MeshStandardMaterial({ color: 0x222222 });
            const legDist = 0.22;
            const legPositions = [[legDist, 0.35, legDist], [-legDist, 0.35, legDist], [legDist, 0.35, -legDist], [-legDist, 0.35, -legDist]];

            legPositions.forEach(pos => {
                const leg = new THREE.Mesh(legGeo, legMat);
                leg.position.set(pos[0], pos[1], pos[2]);
                leg.castShadow = true;
                table.add(leg);
            });
            return table;
        }

        function createTableRound() {
            const roundGroup = new THREE.Group();
            const numTables = 4;
            const radius = 0.55;

            for (let i = 0; i < numTables; i++) {
                const mesa = createHexagonalTable();
                const angle = (i / numTables) * Math.PI * 2;
                mesa.position.x = Math.cos(angle) * radius;
                mesa.position.z = Math.sin(angle) * radius;
                mesa.rotation.y = -angle + Math.PI / 4;
                roundGroup.add(mesa);
            }
            return roundGroup;
        }

        // Distribución de los grupos de alumnos en el espacio libre
        const group1 = createTableRound();
        group1.position.set(-1.8, 0, -0.2);
        scene.add(group1);

        const group2 = createTableRound();
        group2.position.set(1.8, 0, -0.2);
        scene.add(group2);


        // 9. BUCLE DE ANIMACIÓN
        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();
    </script>
</body>
</html>
